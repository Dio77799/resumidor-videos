<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Resumidor de videos</title>
  <desc id="d">Monitor de fósforo verde donde un video se convierte en líneas de apuntes.</desc>
  <defs>
    <radialGradient id="fondo" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0b1a0e"/>
      <stop offset="1" stop-color="#020503"/>
    </radialGradient>
    <radialGradient id="pantalla" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0e2a14"/>
      <stop offset=".75" stop-color="#06150a"/>
      <stop offset="1" stop-color="#020703"/>
    </radialGradient>
    <linearGradient id="marco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b332c"/>
      <stop offset="1" stop-color="#121612"/>
    </linearGradient>
    <pattern id="barrido" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" opacity=".35"/>
    </pattern>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="recorte"><rect x="118" y="128" width="404" height="300" rx="28"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#fondo)"/>

  <!-- Monitor -->
  <rect x="86" y="96" width="468" height="364" rx="40" fill="url(#marco)" stroke="#3a443b" stroke-width="2"/>
  <rect x="118" y="128" width="404" height="300" rx="28" fill="url(#pantalla)"/>
  <g clip-path="url(#recorte)" filter="url(#brillo)" fill="none" stroke="#5cff8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- video -->
    <rect x="150" y="196" width="112" height="84" rx="10"/>
    <path d="M194 220 L224 238 L194 256 Z" fill="#5cff8a" stroke="none"/>
    <!-- onda de audio -->
    <path d="M150 318 h10 l6 -14 l8 28 l8 -36 l8 44 l8 -30 l8 18 l6 -10 h22" stroke-width="3.5"/>
    <!-- flecha -->
    <path d="M286 238 h34 m-12 -12 l12 12 l-12 12"/>
    <!-- apuntes -->
    <g stroke-width="4">
      <path d="M346 186 h136"/>
      <rect x="346" y="210" width="9" height="9" fill="#5cff8a" stroke="none"/><path d="M368 214 h106"/>
      <rect x="346" y="236" width="9" height="9" fill="#5cff8a" stroke="none"/><path d="M368 240 h84"/>
      <rect x="346" y="262" width="9" height="9" fill="#5cff8a" stroke="none"/><path d="M368 266 h98"/>
      <path d="M346 300 h22 m10 0 h70" opacity=".7"/>
      <path d="M346 324 h52 m10 0 h44" opacity=".7"/>
      <path d="M346 348 h12" /><rect x="364" y="338" width="14" height="20" fill="#5cff8a" stroke="none" opacity=".9"/>
    </g>
  </g>
  <rect x="118" y="128" width="404" height="300" rx="28" fill="url(#barrido)"/>
  <rect x="118" y="128" width="404" height="300" rx="28" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="10"/>
  <!-- base del monitor -->
  <path d="M262 460 h116 l18 40 h-152 z" fill="#161b17" stroke="#3a443b" stroke-width="2"/>
  <rect x="214" y="498" width="212" height="18" rx="6" fill="#1d231e" stroke="#3a443b" stroke-width="2"/>
  <circle cx="500" cy="440" r="5" fill="#5cff8a" filter="url(#brillo)"/>

  <!-- Texto -->
  <g font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#5cff8a" filter="url(#brillo)">
    <text x="620" y="232" font-size="66" font-weight="700" letter-spacing="6">RESUMIDOR</text>
    <text x="620" y="306" font-size="66" font-weight="700" letter-spacing="6">DE VIDEOS</text>
    <g font-size="27" fill="#3fd06c">
      <text x="624" y="380">&gt; video, audio o transcripción</text>
      <text x="624" y="420">&gt; apuntes en markdown</text>
      <text x="624" y="460">&gt; 100% local · gratis<tspan fill="#5cff8a">▌</tspan></text>
    </g>
  </g>
  <rect width="1280" height="640" fill="url(#barrido)" opacity=".5"/>
</svg>
