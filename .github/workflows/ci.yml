name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3

  tests:
    # Los tests usan solo la librería estándar: no se instala nada.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

  paquete:
    # Se instala como dependencia (sin la interfaz) y el comando responde.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          cd /tmp
          resumidor --version
          python -m resumidor --help
          python -c "import resumidor.resumir as r; assert (r.PROMPTS / 'unico.md').exists(); assert (r.PAQUETE / 'web' / 'index.html').exists()"
